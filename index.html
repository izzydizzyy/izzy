<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Izzy's Shopping List</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#000;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:30px;
    overflow:hidden;
}

/* Website */
.container{
    max-width:600px;
    width:100%;
    opacity:0;
    transition:opacity .8s ease;
}

h1{
    font-size:3rem;
    margin-bottom:25px;
}

h2{
    font-size:1.5rem;
    margin-bottom:10px;
}

ul{
    margin-left:20px;
    margin-bottom:40px;
    line-height:2;
    font-size:1.2rem;
}

.footer p{
    color:#bdbdbd;
    line-height:1.6;
}

/* Flashbang */
#flashbang{
    position:fixed;
    inset:0;
    background:#fff;
    color:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:9999;
    transition:opacity .8s ease;
    padding:20px;
}

#flashbang h1{
    font-size:clamp(2rem,6vw,4rem);
    line-height:1.2;
}

@media(max-width:600px){
    h1{
        font-size:2.2rem;
    }

    ul{
        font-size:1rem;
    }

    #flashbang h1{
        font-size:2rem;
    }
}
</style>
</head>
<body>

<div id="flashbang">
    <h1>
        YOO WHAT'S UP DAD N MOM<br>
        GET FLASH BANGED YO
    </h1>
</div>

<div class="container" id="site">

    <h1>Izzy's Shopping List</h1>

    <h2>Today's List</h2>

    <ul>
        <li>Avenues Mall</li>
        <li>Best Buy</li>
        <li>GameStop (Inside the Mall)</li>
        <li>Walmart</li>
        <li>Nike</li>
        <li>Etc. Etc. Etc.</li>
    </ul>

    <div class="footer">
        <h2>You're Welcome Bob, Dad & Mom</h2>
        <p>
            Hopefully nobody asks,<br>
            "Where are we going again?" every five minutes 😂✌🏾
        </p>
    </div>

</div>

<script>
window.addEventListener("load", () => {
    const flash = document.getElementById("flashbang");
    const site = document.getElementById("site");

    // Keep the flashbang visible for 1.2 seconds
    setTimeout(() => {
        flash.style.opacity = "0";
        site.style.opacity = "1";
    }, 1200);

    // Remove the flashbang after it fades away
    setTimeout(() => {
        flash.remove();
        document.body.style.overflow = "auto";
    }, 2000);
});
</script>

</body>
</html>
